name: Atualizar EPG GamaTV

on:
  schedule:
    - cron: '0 5 * * *' # Roda automaticamente todos os dias às 04:00 da manhã (UTC)
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  gerar-xml:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar o script Python
        run: python gerar.py

      - name: Salvar o XML gerado no repositório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add guides/brasil.xml
          git commit -m "Atualização automática do EPG GamaTV" || echo "Sem mudanças no EPG hoje. GamaTV"
          git push
